version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits titles, so the PR title check passes; one grouped PR per week
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
    ignore:
      # PDF parsing feeds the RAG index; a major changes extracted text and citations
      - dependency-name: "pypdf"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
