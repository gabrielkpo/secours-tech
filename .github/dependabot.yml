version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # a release is proposed only once it is 14 days old (supply-chain caution); security updates
    # are never delayed by the cooldown
    cooldown:
      default-days: 14
    # Conventional Commits titles, so the PR title check passes; one grouped PR per week
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(docker)"
    groups:
      images:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(docker)"
    groups:
      compose:
        patterns: ["*"]
