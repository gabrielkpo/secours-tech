name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # same Postgres major version and pgvector as the local Homebrew install
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # throwaway CI container, not a real secret
          POSTGRES_DB: secours_tech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secours_tech_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag, so it is pinned to the v10.3.0 commit
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      # --locked fails if uv.lock is out of date, so CI runs exactly the locked versions
      - name: Install
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -rs  # -rs prints why a test was skipped, so a missing database shows up
