name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:  # a new push to a PR cancels its older run; every commit on main keeps its own
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # same Postgres major version and pgvector as the local Homebrew install
      postgres:
        # pinned by digest (pg17 tag on 2026-11-12); update the digest by hand with Postgres
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # throwaway CI container, not a real secret
          POSTGRES_DB: secours_tech_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/secours_tech_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no token left in .git/config for later steps
      # poppler reads and renders the PDF pages, tesseract reads the pages drawn as images
      - run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr
      # every action is pinned to a commit SHA, its version in the trailing comment; Dependabot
      # moves both
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      # --locked fails if uv.lock is out of date, so CI runs exactly the locked versions
      - name: Install
        run: uv sync --locked
      # pinned French model, cached between runs and checked against its SHA-256 (ocr.py)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/tessdata
          key: tessdata-fra-${{ hashFiles('src/secours_tech/ocr.py') }}  # new pin, new cache
      - run: uv run python -c "from secours_tech.ocr import fetch_model; fetch_model()"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -rs  # -rs prints why a test was skipped, so a missing database shows up
