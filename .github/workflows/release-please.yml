name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflow, so the required checks would
          # never run on the release PR. RELEASE_PLEASE_TOKEN, when set, is a fine-grained PAT
          # (contents + pull requests: read/write on this repo only); otherwise close and
          # reopen the release PR to start the checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
