name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflow, so the required checks would
          # never run on the release PR. RELEASE_PLEASE_TOKEN, when set, is a fine-grained PAT
          # with contents and pull requests read/write; otherwise close and reopen the release
          # PR to start the checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
