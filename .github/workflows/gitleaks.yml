name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists the PR commits through the API
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the full history, not only the last commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
