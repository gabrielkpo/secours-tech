name: Corpus watch
# Once a month, compare the official doctrine pages with corpus/sources.toml. The site answers
# 403 to automated clients and the bot does not pretend to be a browser, so a blocked page or
# a difference opens (or updates) a "corpus" issue for a person to check by hand.
on:
  schedule:
    - cron: "0 6 1 * *"  # 1st of each month, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # no token left in .git/config for later steps
      # every action is pinned to a commit SHA, its version in the trailing comment; Dependabot
      # moves both
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - id: check
        run: uv run python -m secours_tech.collect check --report report.md
      - if: steps.check.outputs.action == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create corpus --color 0E8A16 --description "Official doctrine corpus" --force
          issue=$(gh issue list --label corpus --state open --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file report.md
          else
            gh issue create --title "Corpus: check the official doctrine pages" \
              --label corpus --body-file report.md
          fi
