[project]
name = "secours-tech"
version = "0.1.0"
description = "RAG assistant over official French firefighter doctrine (GDO, GTO, SSUAP, PSE), with cited sources."
requires-python = ">=3.11"
dependencies = [
    "pikepdf==10.18.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# local reference embedding (multilingual-e5-base, scoping §6.4); not installed in CI
local = ["torch==2.15.0", "transformers==5.21.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secours_tech"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.uv]
# The packages the `local` extra brought in were held to releases at least two weeks old when it
# was added (11/11/2026); remove a line to let Dependabot move that package again.
exclude-newer-package = { annotated-doc = "2026-10-28T00:00:00Z", anyio = "2026-10-28T00:00:00Z", click = "2026-10-28T00:00:00Z", cuda-bindings = "2026-10-28T00:00:00Z", cuda-pathfinder = "2026-10-28T00:00:00Z", filelock = "2026-10-28T00:00:00Z", hf-xet = "2026-10-28T00:00:00Z", huggingface-hub = "2026-10-28T00:00:00Z", markdown-it-py = "2026-10-28T00:00:00Z", nvidia-nvjitlink = "2026-10-28T00:00:00Z", pydantic = "2026-10-28T00:00:00Z", pydantic-core = "2026-10-28T00:00:00Z", regex = "2026-10-28T00:00:00Z", typer = "2026-10-28T00:00:00Z", typing-inspection = "2026-10-28T00:00:00Z" }
