[project]
name = "secours-tech"
version = "0.1.0"
description = "RAG assistant over official French firefighter doctrine (GDO, GTO, SSUAP, PSE), with cited sources."
readme = "README.md"
license = "MIT"
authors = [{ name = "Gabriel Kpodoh" }]
requires-python = ">=3.11"
dependencies = [
    "pikepdf==10.18.0",
    "psycopg[binary]>=3.2",
]

[project.urls]
Repository = "https://github.com/gabrielkpo/secours-tech"
Issues = "https://github.com/gabrielkpo/secours-tech/issues"

[project.optional-dependencies]
# local reference embedding and reranking; not installed in the main CI job, exercised by the
# Local extra workflow (tests/test_local_extra.py)
local = ["torch==2.15.0", "transformers==5.22.0"]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=8",
    "pytest-cov==7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling==1.33.0"]  # pinned: uv.lock does not lock the build backend
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secours_tech"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PTH", "RET"]
# every subprocess call takes an argument list (no shell) and looks poppler and tesseract up on
# PATH on purpose
ignore = ["S603", "S607"]
# French typography, the dotless i of some PDFs and the "›" of the context headers, on purpose
allowed-confusables = ["’", "‘", "–", "›", "ı"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.uv]
# Young releases are held back until they are two weeks old (the cooldown Dependabot applies);
# review by 2026-12-15 and remove a line to let Dependabot move that package again. A security
# fix for one of them removes its line in the same PR.
exclude-newer-package = { annotated-doc = "2026-10-28T00:00:00Z", ast-serialize = "2026-10-29T00:00:00Z", coverage = "2026-10-29T00:00:00Z", mypy-extensions = "2026-10-29T00:00:00Z", anyio = "2026-10-28T00:00:00Z", click = "2026-10-28T00:00:00Z", cuda-bindings = "2026-10-28T00:00:00Z", cuda-pathfinder = "2026-10-28T00:00:00Z", filelock = "2026-10-28T00:00:00Z", hf-xet = "2026-10-28T00:00:00Z", huggingface-hub = "2026-10-28T00:00:00Z", markdown-it-py = "2026-10-28T00:00:00Z", nvidia-nvjitlink = "2026-10-28T00:00:00Z", pydantic = "2026-10-28T00:00:00Z", pydantic-core = "2026-10-28T00:00:00Z", regex = "2026-10-28T00:00:00Z", typer = "2026-10-28T00:00:00Z", typing-inspection = "2026-10-28T00:00:00Z" }

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# the optional `local` extra (not installed in CI)
module = ["torch", "torch.*", "transformers", "transformers.*", "huggingface_hub"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["secours_tech"]

[tool.coverage.report]
# measured at 81 % when the gate was added; raise it as tests are added, never lower it
fail_under = 80
show_missing = true
skip_covered = true
