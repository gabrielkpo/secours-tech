[project]
name = "secours-tech"
version = "0.1.0"
description = "RAG assistant over official French firefighter doctrine (GDO, GTO, SSUAP, PSE), with cited sources."
requires-python = ">=3.11"
dependencies = [
    "pikepdf==10.17.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secours_tech"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
